# Variables for all Raspberry Pi nodes.
# Only variables that a role, playbook or template actually reads belong here.
#
# Apps are NOT gated by an inventory variable: the apps play in ansible/site.yml
# deploys only when the node's /opt/stacks/env/local.env contains
# APPS_ENABLED=true (`make failover` writes it).
# The daily backup time is hardcoded in the backup-automation role.
---
# Paths on the node (used by the common, compose-deploy and backup roles)
STACKS_PATH: '/opt/stacks'
APPDATA_PATH: '/srv/appdata'
BACKUP_PATH: '/opt/backups'
DB_DUMP_PATH: '/tmp/db_dumps'

# Sudo password, from the vault (group_vars/all.yml)
ansible_sudo_pass: '{{ vault_rpi_sudo_pass }}'

# Backup automation (backup-automation role)
BACKUP_AUTOMATION_ENABLED: true
BACKUP_MIRROR_ENABLED: false # Optional weekly mirror to Linode
BACKUP_WITH_MEDIA_ENABLED: false # Monthly full backup with media (pre-move only)
